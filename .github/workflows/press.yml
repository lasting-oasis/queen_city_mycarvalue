name: Press-site pricing discovery

# Step 1: list manufacturer pricing announcements from each newsroom's sitemap,
# respecting robots.txt. Runs separately from the iSeeCars job (different sites).
on:
  push:
    branches: [main]
    paths: [.github/workflows/press.yml, scripts/press_discover.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/press_discover.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/press
          git commit -m "Press-site pricing URLs $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
