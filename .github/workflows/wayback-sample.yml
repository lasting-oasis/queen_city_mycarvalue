name: Wayback sample pages

# One-off: saves two archived iSeeCars pages as raw HTML to check their table layout.
on:
  push:
    branches: [main]
    paths: [.github/workflows/wayback-sample.yml]

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data/iseecars/samples
          curl -sS -A "QueenCityMyCarValue/1.0" -o data/iseecars/samples/2017-jeep-cherokee.html "https://web.archive.org/web/20191019094555id_/https://www.iseecars.com/car/2017-jeep-cherokee-price"
          sleep 3
          curl -sS -A "QueenCityMyCarValue/1.0" -o data/iseecars/samples/2021-jeep-cherokee.html "https://web.archive.org/web/2021id_/https://www.iseecars.com/car/2021-jeep-cherokee-price"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data/iseecars/samples
          git commit -m "Wayback sample pages" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; sleep 5; done
