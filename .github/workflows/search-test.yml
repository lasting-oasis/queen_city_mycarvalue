name: Search API test

# One-off: AI Overview test. For each line in data/search/ai-queries.txt, asks the
# Searlo full-SERP endpoint and saves only the AI Overview text (and its sources).
on:
  push:
    branches: [main]
    paths: [.github/workflows/search-test.yml, data/search/ai-queries.txt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search
        env:
          KEY: ${{ secrets.SEARCH_API_KEY }}
        run: |
          mkdir -p data/search/ai
          while IFS= read -r q; do
            f="data/search/ai/$(echo "$q" | tr ' ,' '__' | cut -c1-60).json"
            curl -sS -G "https://api.searlo.tech/api/v1/serp" --data-urlencode "q=$q" --data-urlencode "num=3" -H "x-api-key: $KEY" \
              | jq '{q: .searchParameters.q, credits: .credits, aioverview: (.aioverview | if . then {text, complete, sources: [.sources[]?.link]} else null end)}' > "$f"
            echo "$q -> $(jq -r '.credits' "$f") credits" | tee -a data/search/ai/status.txt
            sleep 1
          done < data/search/ai-queries.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/search/ai
          git commit -m "Search API AI Overview test $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
