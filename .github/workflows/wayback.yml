name: iSeeCars prices from the Wayback Machine

# Reads archived iSeeCars price pages from web.archive.org (no load on iSeeCars),
# one every 1.5 seconds, newest model years first. Each run hands off to the next
# until every listed page has been read.
on:
  push:
    branches: [main]
    paths: [.github/workflows/wayback.yml, scripts/wayback_fetch.py, scripts/iseecars_parse.py]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: wayback
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - name: Fetch archived pages, saving every 20 minutes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          : > wayback.log
          for part in 1 2 3 4 5; do
            BUDGET_MIN=20 python3 -u scripts/wayback_fetch.py | tee part.log
            cat part.log >> wayback.log
            cp wayback.log data/iseecars/last-wayback-run.log
            git add -A data/iseecars
            git commit -q -m "Wayback iSeeCars prices $(date -u +%F) (part $part)" || true
            for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
            grep -q "time budget reached" part.log || break
          done
        env:
          DELAY: '1.5'
      - name: Start the next run if pages are left
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "time budget reached" wayback.log; then sleep 120; gh workflow run wayback.yml --ref main
          elif grep -q "keeps refusing" wayback.log; then sleep 1200; gh workflow run wayback.yml --ref main
          fi
