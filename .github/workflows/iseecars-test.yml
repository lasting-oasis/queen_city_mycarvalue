name: iSeeCars access test

# One-off check: saves iSeeCars' robots.txt and three price pages, to see what
# automated readers may access and whether GitHub's runners get blocked.
on:
  push:
    branches: [main]
    paths: [.github/workflows/iseecars-test.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          mkdir -p data/iseecars/test
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -A "$UA" -o data/iseecars/test/robots.txt -w "robots %{http_code}\n" https://www.iseecars.com/robots.txt | tee data/iseecars/test/status.txt
          for p in 2013-lexus-is_350-price 2012-toyota-camry-price 2011-honda-civic-price; do
            sleep 6
            curl -sS -A "$UA" -o "data/iseecars/test/$p.html" -w "$p %{http_code} %{size_download}\n" "https://www.iseecars.com/car/$p" | tee -a data/iseecars/test/status.txt
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/iseecars/test
          git commit -m "iSeeCars access test $(date -u +%F)" && git push
